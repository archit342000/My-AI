# Tooling configuration only. The project is not an installable package.
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", "node_modules", ".claude", "scratch", "static", "reports", "plans", "frontend"]

[tool.ruff.lint]
# Correctness checks only: syntax errors, broken comparisons and undefined names. Style and unused-code rules
# (F401, F841, F811) are not enabled because the existing code has ~340 findings; see docs/standards/python.md.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Known defects, listed in docs/pitfalls.md. Remove these entries when fixed.
"backend/tools/agents/research_agent/agent.py" = ["F821"]
"backend/tools/agents/research_agent/research_utils.py" = ["F821"]
