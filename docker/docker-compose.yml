name: my-ai

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    networks:
      # gw_priority 1 keeps the default route on My-AI's own network: a host firewall drops new connections from the
      # edge subnet (10.250.0.0/24) to private ranges and the host, so the app's outbound traffic (inference server,
      # LAN) must leave through secure-internal. Check: `docker compose exec app ip route` must not default via 10.250.0.1.
      secure-internal:
        gw_priority: 1
      # The gateway's tunnel connector reaches the app as http://my-ai:5000 over this network. Only the app joins it.
      edge:
        aliases:
          - my-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tavily_mcp
      - playwright_mcp
      - inference-proxy
    volumes:
      - /home/archit-anand/docker-data/shared/My-AI-data:/app/backend/data
      - ..:/app
    environment:
      - TZ=Asia/Kolkata
      - AI_PROXY_URL=http://inference-proxy:5001
      - CODE_RUNNER_URL=http://code_runner_mcp:8100
      - AUTH_PROVIDER=${AUTH_PROVIDER:-cloudflare_access}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-architanand.cloudflareaccess.com}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-39c2a56781aaf35e80632ce59d41dd9637ea1fa0fd5dc5f9eedd38bf811c991d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-archit342000@gmail.com}
      - AUTH_STATIC_EMAIL=${AUTH_STATIC_EMAIL:-}
    secrets:
      - DATA_DIR
      - AI_URL
      - AI_API_KEY
      - EMBEDDING_URL
      - EMBEDDING_API_KEY
      - TAVILY_API_KEY
      - MCP_API_KEY
      - PLAYWRIGHT_MCP_API_KEY
      - HF_TOKEN
      - CODE_RUNNER_API_KEY
    restart: unless-stopped

  bastion_ssh:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bastion
    container_name: bastion_ssh
    volumes:
      - ../secrets/authorized_keys:/home/appuser/.ssh/authorized_keys:ro
    ports:
      - 2222:2222
    networks:
      - secure-internal
    restart: unless-stopped

  tavily_mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: tavily_mcp
    networks:
      - secure-internal
    volumes:
      - ../tavily_mcp:/app/tavily_mcp
    environment:
      - TZ=Asia/Kolkata
    secrets:
      - TAVILY_API_KEY
      - MCP_API_KEY
    restart: unless-stopped

  playwright_mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.playwright
    container_name: playwright_mcp
    networks:
      - secure-internal
    volumes:
      - ../playwright_mcp:/app/playwright_mcp
      - /home/archit-anand/docker-data/shared/My-AI-playwright-data:/app/playwright_data
    environment:
      - TZ=Asia/Kolkata
    secrets:
      - PLAYWRIGHT_MCP_API_KEY
    command: ["/app/playwright_mcp/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8001), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  inference-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: inference-proxy
    ports:
      - "5001:5001"
    networks:
      - secure-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    secrets:
      - AI_URL
      - AI_API_KEY
      - EMBEDDING_URL
      - EMBEDDING_API_KEY
    command: ["python3", "inference_proxy/app.py"]
    restart: unless-stopped

  # Sandboxed code runs here. Only runner-net: no internet, no mysql_db, no app.
  code_runner_runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile.code-runner
    image: my-ai-code-runner
    networks:
      - runner-net
    # Split-uid isolation (docs/standards/docker.md, "Exception: code_runner_runtime"). The server is root with only
    # SETUID, SETGID and KILL; user code runs as uid 61001 and installs as 61002.
    user: "0:0"
    read_only: true  # leaves only the tmpfs mounts below, /dev/mqueue and the runner_packages volume (written only by runner-pkg) writable
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:exec,size=512m,mode=1777  # exec: compiled output runs from the sandbox; a Go build failed at 64m in testing
      - /var/tmp:size=16m,mode=1777
      - /dev/shm:size=16m,mode=1777
      - /run/keys:size=1m,mode=0700  # root-only: user code cannot even traverse it, so it cannot read the API key
    volumes:
      - ../code_runner_mcp:/app:ro  # must be world-readable: the helper runs from here as the runner uid
      # Installed packages (written by runner-pkg, read-only for user code) must survive the read-only root and restarts.
      - runner_packages:/opt/runner
    secrets:
      # Compose ignores uid/gid/mode for file secrets, so the key is mounted inside the root-only tmpfs directory. The
      # host file must be readable by root (mode 644, or owned by root): the server has no CAP_DAC_OVERRIDE.
      - source: CODE_RUNNER_API_KEY
        target: /run/keys/CODE_RUNNER_API_KEY
    environment:
      - API_KEY_FILE=/run/keys/CODE_RUNNER_API_KEY
      # Installs go through the allowlisted package proxy (pkg-proxy); the runtime itself has no route out.
      - PIP_INDEX_URL=http://pkg-proxy:8080/pypi/simple/
      - PIP_TRUSTED_HOST=pkg-proxy
      - npm_config_registry=http://pkg-proxy:8080/npm/
      - npm_config_audit=false
      - npm_config_fund=false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${CODE_RUNNER_MEMORY_LIMIT:-512M}
          cpus: "${CODE_RUNNER_CPU_LIMIT:-1.0}"
          pids: 512
    restart: unless-stopped

  # Package proxy for /install: nginx with fixed upstreams only (PyPI, files.pythonhosted.org, registry.npmjs.org).
  # It joins runner-net (so the runtime can reach it) and pkg-egress (its only route out), and nothing else: no
  # secure-internal, no secrets, no volumes. See docs/standards/security.md for what this does and does not enforce.
  pkg-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pkg-proxy
    image: my-ai-pkg-proxy
    networks:
      - runner-net
      - pkg-egress
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  # Relay: the app's only route to the runner. Forwards TCP 8100 to code_runner_runtime and nothing else.
  # It runs /app/relay.py from its own slim image (no toolchains, no host mount), so the sandbox cannot change it.
  code_runner_mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.relay
    image: my-ai-code-runner-relay
    networks:
      - secure-internal
      - runner-net
    environment:
      - RELAY_TARGET=code_runner_runtime:8100
    healthcheck:
      # The relay's own loopback health port, so it stays healthy while the runtime is down.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - code_runner_runtime
    restart: unless-stopped

  mysql_db:
    image: mysql:8.0
    networks:
      - secure-internal
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
      - MYSQL_USER
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=sandbox
      - MYSQL_USER_FILE=/run/secrets/MYSQL_USER
      - MYSQL_PASSWORD_FILE=/run/secrets/MYSQL_PASSWORD
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

networks:
  secure-internal:
    driver: bridge
  # Created by the architanand.dev gateway stack (subnet 10.250.0.0/24), which attaches its cloudflared connector to it.
  # Only `app` joins it: never bastion_ssh (2222) or inference-proxy (5001). With no gateway, create it once with
  # `docker network create --subnet 10.250.0.0/24 edge`.
  edge:
    external: true
  # Internal only: no route to the internet or to mysql_db. The relay code_runner_mcp and the package proxy pkg-proxy
  # join it as well; the app does not.
  runner-net:
    driver: bridge
    internal: true
  # The package proxy's only route out. Only pkg-proxy joins it. The bridge name is fixed so an optional host
  # DOCKER-USER rule can match it (docs/standards/security.md); a second copy of the stack on the same host
  # (for example a throwaway verification stack) must override the name.
  pkg-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: myai-pkg-egress

volumes:
  mysql_data:
  runner_packages:

secrets:
  # Defining secrets mapped to files in the ../secrets directory
  DATA_DIR:
    file: ../secrets/DATA_DIR
  AI_URL:
    file: ../secrets/AI_URL
  AI_API_KEY:
    file: ../secrets/AI_API_KEY
  EMBEDDING_URL:
    file: ../secrets/EMBEDDING_URL
  EMBEDDING_API_KEY:
    file: ../secrets/EMBEDDING_API_KEY
  TAVILY_API_KEY:
    file: ../secrets/TAVILY_API_KEY
  MCP_API_KEY:
    file: ../secrets/MCP_API_KEY
  PLAYWRIGHT_MCP_API_KEY:
    file: ../secrets/PLAYWRIGHT_MCP_API_KEY
  HF_TOKEN:
    file: ../secrets/HF_TOKEN
  CODE_RUNNER_API_KEY:
    file: ../secrets/CODE_RUNNER_API_KEY
  MYSQL_ROOT_PASSWORD:
    file: ../secrets/MYSQL_ROOT_PASSWORD
  MYSQL_USER:
    file: ../secrets/MYSQL_USER
  MYSQL_PASSWORD:
    file: ../secrets/MYSQL_PASSWORD
