name: my-ai

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    networks:
      - secure-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tavily_mcp
      - playwright_mcp
      - inference-proxy
    volumes:
      - /home/archit-anand/docker-data/shared/My-AI-data:/app/backend/data
      - ..:/app
    environment:
      - TZ=Asia/Kolkata
      - AI_PROXY_URL=http://inference-proxy:5001
      - CODE_RUNNER_URL=http://code_runner_mcp:8100
    secrets:
      - DATA_DIR
      - APP_PASSWORD
      - AI_URL
      - AI_API_KEY
      - EMBEDDING_URL
      - EMBEDDING_API_KEY
      - TAVILY_API_KEY
      - MCP_API_KEY
      - PLAYWRIGHT_MCP_API_KEY
      - HF_TOKEN
      - CODE_RUNNER_API_KEY

  bastion_ssh:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bastion
    container_name: bastion_ssh
    volumes:
      - ../secrets/authorized_keys:/home/appuser/.ssh/authorized_keys:ro
    ports:
      - 2222:2222
    networks:
      - secure-internal
    restart: unless-stopped

  tavily_mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: tavily_mcp
    networks:
      - secure-internal
    volumes:
      - ../tavily_mcp:/app/tavily_mcp
    environment:
      - TZ=Asia/Kolkata
    secrets:
      - TAVILY_API_KEY
      - MCP_API_KEY
    restart: unless-stopped

  playwright_mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.playwright
    container_name: playwright_mcp
    networks:
      - secure-internal
    volumes:
      - ../playwright_mcp:/app/playwright_mcp
      - /home/archit-anand/docker-data/shared/My-AI-playwright-data:/app/playwright_data
    environment:
      - TZ=Asia/Kolkata
    secrets:
      - PLAYWRIGHT_MCP_API_KEY
    command: ["/app/playwright_mcp/entrypoint.sh"]
    restart: unless-stopped

  inference-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: inference-proxy
    ports:
      - "5001:5001"
    networks:
      - secure-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    secrets:
      - AI_URL
      - AI_API_KEY
      - EMBEDDING_URL
      - EMBEDDING_API_KEY
    command: ["python3", "inference_proxy/app.py"]
    restart: unless-stopped

  # Sandboxed code runs here. Only runner-net: no internet, no mysql_db, no app.
  code_runner_runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile.code-runner
    image: my-ai-code-runner
    networks:
      - runner-net
    volumes:
      - ../code_runner_mcp:/app:ro
    secrets:
      - CODE_RUNNER_API_KEY
    environment:
      - API_KEY_FILE=/run/secrets/CODE_RUNNER_API_KEY
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${CODE_RUNNER_MEMORY_LIMIT:-512M}
          cpus: "${CODE_RUNNER_CPU_LIMIT:-1.0}"
    restart: unless-stopped

  # Relay: the app's only route to the runner. Forwards TCP 8100 to code_runner_runtime and nothing else.
  # The relay runs /app/relay.py from the image (no host mount), so the sandbox cannot change what it executes.
  code_runner_mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.code-runner
    image: my-ai-code-runner
    command: ["python3", "/app/relay.py"]
    networks:
      - secure-internal
      - runner-net
    environment:
      - RELAY_TARGET=code_runner_runtime:8100
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - code_runner_runtime
    restart: unless-stopped

  mysql_db:
    image: mysql:8.0
    networks:
      - secure-internal
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
      - MYSQL_USER
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=sandbox
      - MYSQL_USER_FILE=/run/secrets/MYSQL_USER
      - MYSQL_PASSWORD_FILE=/run/secrets/MYSQL_PASSWORD
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

networks:
  secure-internal:
    driver: bridge
  # Internal only: no route to the internet or to mysql_db. Only the app service joins it as well.
  runner-net:
    driver: bridge
    internal: true

volumes:
  mysql_data:

secrets:
  # Defining secrets mapped to files in the ../secrets directory
  DATA_DIR:
    file: ../secrets/DATA_DIR
  APP_PASSWORD:
    file: ../secrets/APP_PASSWORD
  AI_URL:
    file: ../secrets/AI_URL
  AI_API_KEY:
    file: ../secrets/AI_API_KEY
  EMBEDDING_URL:
    file: ../secrets/EMBEDDING_URL
  EMBEDDING_API_KEY:
    file: ../secrets/EMBEDDING_API_KEY
  TAVILY_API_KEY:
    file: ../secrets/TAVILY_API_KEY
  MCP_API_KEY:
    file: ../secrets/MCP_API_KEY
  PLAYWRIGHT_MCP_API_KEY:
    file: ../secrets/PLAYWRIGHT_MCP_API_KEY
  HF_TOKEN:
    file: ../secrets/HF_TOKEN
  CODE_RUNNER_API_KEY:
    file: ../secrets/CODE_RUNNER_API_KEY
  MYSQL_ROOT_PASSWORD:
    file: ../secrets/MYSQL_ROOT_PASSWORD
  MYSQL_USER:
    file: ../secrets/MYSQL_USER
  MYSQL_PASSWORD:
    file: ../secrets/MYSQL_PASSWORD
