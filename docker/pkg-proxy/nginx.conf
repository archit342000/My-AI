# Package proxy for the sandboxed code runner (service pkg-proxy).
#
# What it is: a reverse proxy with three fixed upstream locations, not a general forwarder. The runtime reaches it
# on runner-net; its only route out is the pkg-egress network. It serves GET and HEAD only and nothing else.
#
#   /pypi/simple/  -> https://pypi.org/simple/
#   /pypi/files/   -> https://files.pythonhosted.org/
#   /npm/          -> https://registry.npmjs.org/
#
# Absolute upstream URLs inside index and metadata responses are rewritten to the locations above, so pip and npm
# fetch the files through this proxy too.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # The root filesystem is read-only; everything nginx writes goes to /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's embedded DNS; variables in proxy_pass make nginx re-resolve, so CDN address changes are picked up.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Upstream TLS is always verified.
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # NOTE: proxy_set_header is inherited only by locations that set none of their own, so each registry location
    # below repeats the same lines: nothing from the client's identity or body goes upstream, and upstream bodies
    # stay uncompressed so sub_filter can rewrite them.

    # Any other Host, an absolute-URI request line or a path we do not serve lands here: 404.
    server {
        listen 8080 default_server;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name pkg-proxy;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /pypi/simple/ {
            limit_except GET HEAD { deny all; }
            set $pypi_host pypi.org;
            rewrite ^/pypi/simple/(.*)$ /simple/$1 break;
            proxy_pass https://$pypi_host;
            proxy_ssl_name pypi.org;
            proxy_set_header Host pypi.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            # GET and HEAD carry no body here: do not forward one (it would be an extra outbound channel).
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Transfer-Encoding "";
            sub_filter_once off;
            sub_filter_types application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.v1+html application/json;
            sub_filter 'https://files.pythonhosted.org/' 'http://pkg-proxy:8080/pypi/files/';
            # An upstream redirect (for example to the normalised project name) stays on the proxy.
            proxy_redirect https://pypi.org/simple/ http://pkg-proxy:8080/pypi/simple/;
        }

        location /pypi/files/ {
            limit_except GET HEAD { deny all; }
            set $files_host files.pythonhosted.org;
            rewrite ^/pypi/files/(.*)$ /$1 break;
            proxy_pass https://$files_host;
            proxy_ssl_name files.pythonhosted.org;
            proxy_redirect https://files.pythonhosted.org/ http://pkg-proxy:8080/pypi/files/;
            # Wheels can be large: stream them instead of buffering into the (memory-backed) /tmp.
            proxy_buffering off;
            proxy_set_header Host files.pythonhosted.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            # GET and HEAD carry no body here: do not forward one (it would be an extra outbound channel).
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Transfer-Encoding "";
        }

        location /npm/ {
            limit_except GET HEAD { deny all; }
            set $npm_host registry.npmjs.org;
            rewrite ^/npm/(.*)$ /$1 break;
            proxy_pass https://$npm_host;
            proxy_ssl_name registry.npmjs.org;
            proxy_set_header Host registry.npmjs.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            # GET and HEAD carry no body here: do not forward one (it would be an extra outbound channel).
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Transfer-Encoding "";
            sub_filter_once off;
            sub_filter_types application/json application/vnd.npm.install-v1+json;
            sub_filter 'https://registry.npmjs.org/' 'http://pkg-proxy:8080/npm/';
            proxy_redirect https://registry.npmjs.org/ http://pkg-proxy:8080/npm/;
        }

        location / {
            return 404;
        }
    }
}
